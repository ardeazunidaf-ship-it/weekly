<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Produk — Panel Admin</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="login-dot"></span> PANEL</div>

    <div class="nav-group">
      <div class="nav-label">Menu</div>
      <a href="dashboard.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </a>
      <a href="data.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>
        Data Produk
      </a>
    </div>

    <div class="sidebar-footer">
      <button class="btn btn-danger btn-sm" style="width:100%" id="logoutBtn">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="breadcrumb">PANEL / DATA PRODUK</div>
        <h2>Data Produk</h2>
      </div>
      <button class="btn btn-primary btn-sm" id="openAddModal">+ Tambah Produk</button>
    </div>

    <div class="panel">
      <div class="table-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Cari nama produk…">
        </div>
        <select class="filter-select" id="categoryFilter">
          <option value="">Semua kategori</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Produk</th>
            <th>Kategori</th>
            <th>Stok</th>
            <th>Harga</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">Tidak ada produk yang cocok.</div>
    </div>
  </main>
</div>

<!-- Modal Tambah/Edit -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Tambah Produk</h3>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="field">
        <label>Nama Produk</label>
        <input type="text" id="pNama" required>
      </div>
      <div class="field">
        <label>Kategori</label>
        <input type="text" id="pKategori" required>
      </div>
      <div class="field">
        <label>Stok</label>
        <input type="number" id="pStok" min="0" required>
      </div>
      <div class="field">
        <label>Harga (Rp)</label>
        <input type="number" id="pHarga" min="0" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelProductModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Konfirmasi Hapus -->
<div class="modal-overlay" id="deleteModalOverlay">
  <div class="modal">
    <h3>Hapus Produk?</h3>
    <p style="color:var(--muted); font-size:13px;">Tindakan ini tidak dapat dibatalkan.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="cancelDeleteModal">Batal</button>
      <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Hapus</button>
    </div>
  </div>
</div>

<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/data.js"></script>
<script>
  requireAuth();
  document.getElementById('logoutBtn').addEventListener('click', () => logout());

  let pendingDeleteId = null;

  (async function () {
    await initProductData();
    populateCategoryFilter();
    renderTable();
  })();

  function populateCategoryFilter() {
    const select = document.getElementById('categoryFilter');
    const categories = [...new Set(getProducts().map(p => p.kategori))];
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function renderTable() {
    const query = document.getElementById('searchInput').value;
    const kategori = document.getElementById('categoryFilter').value;
    const products = filterProducts({ query, kategori });
    const tbody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');

    tbody.innerHTML = '';
    emptyState.style.display = products.length ? 'none' : 'block';

    products.forEach(p => {
      const tr = document.createElement('tr');
      const stokBadge = p.stok <= 10 ? 'low' : 'ok';
      tr.innerHTML = `
        <td class="mono">#${p.id}</td>
        <td>${escapeHtml(p.nama)}</td>
        <td>${escapeHtml(p.kategori)}</td>
        <td><span class="badge ${stokBadge}">${p.stok} unit</span></td>
        <td class="mono">${formatRupiah(p.harga)}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" data-edit="${p.id}">Edit</button>
            <button class="icon-btn" data-delete="${p.id}">Hapus</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('[data-edit]').forEach(btn =>
      btn.addEventListener('click', () => openEditModal(Number(btn.dataset.edit)))
    );
    tbody.querySelectorAll('[data-delete]').forEach(btn =>
      btn.addEventListener('click', () => openDeleteModal(Number(btn.dataset.delete)))
    );
  }

  document.getElementById('searchInput').addEventListener('input', renderTable);
  document.getElementById('categoryFilter').addEventListener('change', renderTable);

  // --- Modal Tambah/Edit ---
  const productOverlay = document.getElementById('productModalOverlay');
  const productForm = document.getElementById('productForm');

  document.getElementById('openAddModal').addEventListener('click', () => {
    document.getElementById('modalTitle').textContent = 'Tambah Produk';
    productForm.reset();
    document.getElementById('productId').value = '';
    productOverlay.classList.add('show');
  });

  document.getElementById('cancelProductModal').addEventListener('click', () => productOverlay.classList.remove('show'));

  function openEditModal(id) {
    const product = getProducts().find(p => p.id === id);
    if (!product) return;
    document.getElementById('modalTitle').textContent = 'Edit Produk';
    document.getElementById('productId').value = product.id;
    document.getElementById('pNama').value = product.nama;
    document.getElementById('pKategori').value = product.kategori;
    document.getElementById('pStok').value = product.stok;
    document.getElementById('pHarga').value = product.harga;
    productOverlay.classList.add('show');
  }

  productForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const payload = {
      nama: document.getElementById('pNama').value.trim(),
      kategori: document.getElementById('pKategori').value.trim(),
      stok: Number(document.getElementById('pStok').value),
      harga: Number(document.getElementById('pHarga').value)
    };

    if (id) {
      updateProduct(Number(id), payload);
      showToast('Produk berhasil diperbarui.', 'success');
    } else {
      addProduct(payload);
      showToast('Produk baru berhasil ditambahkan.', 'success');
    }

    productOverlay.classList.remove('show');
    populateCategoryFilter();
    renderTable();
  });

  // --- Modal Hapus ---
  const deleteOverlay = document.getElementById('deleteModalOverlay');

  function openDeleteModal(id) {
    pendingDeleteId = id;
    deleteOverlay.classList.add('show');
  }

  document.getElementById('cancelDeleteModal').addEventListener('click', () => {
    pendingDeleteId = null;
    deleteOverlay.classList.remove('show');
  });

  document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
    if (pendingDeleteId !== null) {
      deleteProduct(pendingDeleteId);
      showToast('Produk berhasil dihapus.', 'success');
      renderTable();
    }
    pendingDeleteId = null;
    deleteOverlay.classList.remove('show');
  });
</script>
</body>
</html>
